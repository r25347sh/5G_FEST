<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>5G_FEST</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #0a0a1a 0%, #1a1a3a 50%, #0d1b2a 100%);
      color: #e0e0ff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    h1 {
      font-size: 3rem;
      letter-spacing: 0.2em;
      text-shadow: 0 0 20px #4a90ff, 0 0 40px #4a90ff55;
      margin-bottom: 0.5rem;
    }
    p {
      opacity: 0.8;
      margin-bottom: 2rem;
    }
    a {
      display: inline-block;
      padding: 1rem 2.5rem;
      background: linear-gradient(90deg, #3a6fff, #6a4fff);
      color: white;
      text-decoration: none;
      border-radius: 50px;
      font-weight: 600;
      letter-spacing: 0.05em;
      box-shadow: 0 8px 25px rgba(74, 144, 255, 0.4);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    a:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 35px rgba(74, 144, 255, 0.6);
    }
    .note {
      margin-top: 3rem;
      font-size: 0.85rem;
      opacity: 0.6;
    }
  </style>
</head>
<body>
  <h1>5G_FEST</h1>
  <p>3D ピタゴラスイッチ サンプル</p>
  <a href="sample/">▶ サンプルを開く</a>
  <p class="note">物理法則に基づく本格的な3Dギミック連鎖です。<br>ブラウザで動作します（Three.js + Cannon.js）</p>
</body>
</html>
