<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Opera Pink 05 — Volumetric Rays</title>
  <style>
    * { margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #020104; }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, cx, cy, t = 0;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  cx = W / 2; cy = H / 2;
}
window.addEventListener('resize', resize);
resize();

const rays = [];
for (let i = 0; i < 16; i++) {
  rays.push({
    angle: (i / 16) * Math.PI * 2,
    speed: 0.0015 + Math.random() * 0.0025,
    width: 0.03 + Math.random() * 0.05,
    len: 0.6 + Math.random() * 0.5,
    alpha: 0.06 + Math.random() * 0.1,
    phase: Math.random() * Math.PI * 2
  });
}

const mist = [];
for (let i = 0; i < 30; i++) {
  mist.push({
    x: Math.random(),
    y: Math.random(),
    r: 40 + Math.random() * 120,
    vx: (Math.random() - 0.5) * 0.0002,
    vy: (Math.random() - 0.5) * 0.00015,
    phase: Math.random() * Math.PI * 2
  });
}

function draw() {
  t += 0.01;
  ctx.fillStyle = 'rgba(2,1,4,0.12)';
  ctx.fillRect(0, 0, W, H);

  const base = Math.max(W, H);

  // volumetric rays
  rays.forEach(r => {
    r.angle += r.speed;
    const pulse = 0.7 + Math.sin(t * 1.2 + r.phase) * 0.3;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(r.angle);

    const grad = ctx.createLinearGradient(0, 0, 0, -base * r.len * pulse);
    grad.addColorStop(0, `rgba(200,50,110,${r.alpha * pulse})`);
    grad.addColorStop(0.3, `rgba(160,30,80,${r.alpha * 0.5 * pulse})`);
    grad.addColorStop(0.7, `rgba(100,15,50,${r.alpha * 0.15})`);
    grad.addColorStop(1, 'transparent');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(-base * r.width, 0);
    ctx.lineTo(base * r.width, 0);
    ctx.lineTo(base * r.width * 5, -base * r.len * pulse);
    ctx.lineTo(-base * r.width * 5, -base * r.len * pulse);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  });

  // soft mist clouds
  mist.forEach(m => {
    m.x += m.vx;
    m.y += m.vy;
    if (m.x < -0.3) m.x = 1.3;
    if (m.x > 1.3) m.x = -0.3;
    if (m.y < -0.3) m.y = 1.3;
    if (m.y > 1.3) m.y = -0.3;

    const px = m.x * W;
    const py = m.y * H;
    const pulse = 0.8 + Math.sin(t * 0.7 + m.phase) * 0.2;
    const g = ctx.createRadialGradient(px, py, 0, px, py, m.r * pulse);
    g.addColorStop(0, `rgba(140,30,80,${0.07 * pulse})`);
    g.addColorStop(0.5, `rgba(80,15,45,${0.03})`);
    g.addColorStop(1, 'transparent');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(px, py, m.r * pulse, 0, Math.PI * 2);
    ctx.fill();
  });

  // central ethereal core
  const corePulse = 0.85 + Math.sin(t * 0.9) * 0.15;
  const cg = ctx.createRadialGradient(cx, cy, 0, cx, cy, base * 0.22 * corePulse);
  cg.addColorStop(0, `rgba(220,80,140,${0.18 * corePulse})`);
  cg.addColorStop(0.4, `rgba(160,40,90,${0.08})`);
  cg.addColorStop(1, 'transparent');
  ctx.fillStyle = cg;
  ctx.beginPath();
  ctx.arc(cx, cy, base * 0.22 * corePulse, 0, Math.PI * 2);
  ctx.fill();

  // tiny floating sparks
  for (let i = 0; i < 20; i++) {
    const a = t * 0.3 + i * 0.7;
    const dist = 0.1 + (Math.sin(t * 0.5 + i) * 0.5 + 0.5) * 0.4;
    const x = cx + Math.cos(a) * dist * base * 0.5;
    const y = cy + Math.sin(a * 0.8) * dist * base * 0.4;
    const s = 0.8 + Math.sin(t * 3 + i) * 0.6;
    ctx.beginPath();
    ctx.arc(x, y, s, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,180,210,${0.25 + Math.sin(t * 2 + i) * 0.2})`;
    ctx.fill();
  }

  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
