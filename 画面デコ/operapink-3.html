<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Opera Pink 03 — Petals</title>
  <style>
    * { margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #030105; }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, t = 0;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

const petals = [];
for (let i = 0; i < 55; i++) {
  petals.push({
    x: Math.random() * W,
    y: Math.random() * H - H * 0.3,
    size: 6 + Math.random() * 18,
    speed: 0.3 + Math.random() * 0.9,
    sway: Math.random() * Math.PI * 2,
    swaySpeed: 0.01 + Math.random() * 0.02,
    rot: Math.random() * Math.PI * 2,
    rotSpeed: (Math.random() - 0.5) * 0.03,
    alpha: 0.25 + Math.random() * 0.45,
    type: Math.floor(Math.random() * 3)
  });
}

function drawPetal(p) {
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.rotate(p.rot);
  ctx.globalAlpha = p.alpha * (0.7 + Math.sin(t * 2 + p.sway) * 0.3);

  if (p.type === 0) {
    // oval petal
    ctx.beginPath();
    ctx.ellipse(0, 0, p.size * 0.6, p.size, 0, 0, Math.PI * 2);
    const g = ctx.createRadialGradient(0, -p.size * 0.3, 0, 0, 0, p.size);
    g.addColorStop(0, 'rgba(255,180,210,0.9)');
    g.addColorStop(0.5, 'rgba(200,60,120,0.7)');
    g.addColorStop(1, 'rgba(120,20,60,0.3)');
    ctx.fillStyle = g;
    ctx.fill();
  } else if (p.type === 1) {
    // teardrop
    ctx.beginPath();
    ctx.moveTo(0, -p.size);
    ctx.bezierCurveTo(p.size * 0.8, -p.size * 0.3, p.size * 0.6, p.size * 0.5, 0, p.size);
    ctx.bezierCurveTo(-p.size * 0.6, p.size * 0.5, -p.size * 0.8, -p.size * 0.3, 0, -p.size);
    ctx.fillStyle = `rgba(210,50,110,${0.6 + Math.sin(t + p.sway) * 0.2})`;
    ctx.fill();
  } else {
    // soft circle glow
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, p.size);
    g.addColorStop(0, 'rgba(255,150,190,0.7)');
    g.addColorStop(0.6, 'rgba(180,40,100,0.3)');
    g.addColorStop(1, 'transparent');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(0, 0, p.size, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

function draw() {
  t += 0.012;
  ctx.fillStyle = 'rgba(3,1,5,0.1)';
  ctx.fillRect(0, 0, W, H);

  // subtle vertical haze
  const haze = ctx.createLinearGradient(0, 0, 0, H);
  haze.addColorStop(0, 'rgba(60,10,35,0.08)');
  haze.addColorStop(0.5, 'transparent');
  haze.addColorStop(1, 'rgba(40,5,25,0.1)');
  ctx.fillStyle = haze;
  ctx.fillRect(0, 0, W, H);

  petals.forEach(p => {
    p.y += p.speed;
    p.x += Math.sin(t * p.swaySpeed * 50 + p.sway) * 0.8;
    p.rot += p.rotSpeed;
    p.sway += p.swaySpeed;

    if (p.y > H + 40) {
      p.y = -40;
      p.x = Math.random() * W;
    }
    drawPetal(p);
  });

  // occasional bright sparkles
  if (Math.random() < 0.08) {
    const sx = Math.random() * W;
    const sy = Math.random() * H;
    ctx.beginPath();
    ctx.arc(sx, sy, 1 + Math.random() * 2, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,200,220,${0.4 + Math.random() * 0.4})`;
    ctx.fill();
  }

  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
