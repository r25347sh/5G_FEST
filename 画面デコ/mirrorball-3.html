<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mirror Ball 03</title>
  <style>
    * { margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, cx, cy, t = 0;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  cx = W / 2; cy = H / 2;
}
window.addEventListener('resize', resize);
resize();

const orbs = [];
for (let i = 0; i < 7; i++) {
  orbs.push({
    angle: (i / 7) * Math.PI * 2,
    dist: 0.15 + (i % 3) * 0.12,
    size: 40 + (i % 4) * 25,
    speed: 0.004 + (i % 5) * 0.0015,
    phase: Math.random() * Math.PI * 2
  });
}

const rays = [];
for (let i = 0; i < 18; i++) {
  rays.push({
    angle: (i / 18) * Math.PI * 2,
    speed: 0.002 + Math.random() * 0.003,
    len: 0.5 + Math.random() * 0.5,
    alpha: 0.08 + Math.random() * 0.12,
    width: 0.02 + Math.random() * 0.04
  });
}

const dust = [];
for (let i = 0; i < 80; i++) {
  dust.push({
    x: Math.random(),
    y: Math.random(),
    z: Math.random(),
    r: 0.4 + Math.random() * 1.5
  });
}

function draw() {
  t += 0.01;
  ctx.fillStyle = 'rgba(0,0,0,0.18)';
  ctx.fillRect(0, 0, W, H);

  const base = Math.min(W, H);

  // soft rays from center
  rays.forEach(r => {
    r.angle += r.speed;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(r.angle);
    const grad = ctx.createLinearGradient(0, 0, 0, -base * r.len);
    grad.addColorStop(0, `rgba(180,200,255,${r.alpha})`);
    grad.addColorStop(0.4, `rgba(140,160,230,${r.alpha * 0.4})`);
    grad.addColorStop(1, 'transparent');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(-base * r.width, 0);
    ctx.lineTo(base * r.width, 0);
    ctx.lineTo(base * r.width * 4, -base * r.len);
    ctx.lineTo(-base * r.width * 4, -base * r.len);
    ctx.fill();
    ctx.restore();
  });

  // floating soft orbs
  orbs.forEach((o, i) => {
    o.angle += o.speed;
    const ox = cx + Math.cos(o.angle) * o.dist * base;
    const oy = cy + Math.sin(o.angle * 0.7 + o.phase) * o.dist * base * 0.6;
    const pulse = 0.85 + Math.sin(t * 1.5 + o.phase) * 0.15;
    const sz = o.size * pulse;

    const g = ctx.createRadialGradient(ox, oy, 0, ox, oy, sz);
    g.addColorStop(0, 'rgba(220,230,255,0.45)');
    g.addColorStop(0.3, 'rgba(160,180,240,0.2)');
    g.addColorStop(0.7, 'rgba(80,100,180,0.06)');
    g.addColorStop(1, 'transparent');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(ox, oy, sz, 0, Math.PI * 2);
    ctx.fill();

    // tiny core
    ctx.beginPath();
    ctx.arc(ox, oy, sz * 0.12, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,${0.5 + Math.sin(t * 2 + i) * 0.3})`;
    ctx.fill();
  });

  // main soft sphere
  const mainPulse = 0.9 + Math.sin(t * 0.8) * 0.1;
  const ms = base * 0.18 * mainPulse;
  const mg = ctx.createRadialGradient(cx, cy, 0, cx, cy, ms);
  mg.addColorStop(0, 'rgba(230,235,255,0.35)');
  mg.addColorStop(0.4, 'rgba(150,170,230,0.15)');
  mg.addColorStop(1, 'transparent');
  ctx.fillStyle = mg;
  ctx.beginPath();
  ctx.arc(cx, cy, ms, 0, Math.PI * 2);
  ctx.fill();

  // dust particles drifting
  dust.forEach(d => {
    d.x += 0.0003 * (0.5 - d.z);
    d.y += 0.0002;
    if (d.x > 1.1) d.x = -0.1;
    if (d.y > 1.1) d.y = -0.1;
    const px = d.x * W;
    const py = d.y * H;
    const a = 0.15 + d.z * 0.4;
    ctx.beginPath();
    ctx.arc(px, py, d.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(200,210,255,${a})`;
    ctx.fill();
  });

  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
