<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mirror Ball 02</title>
  <style>
    * { margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, cx, cy, t = 0;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  cx = W / 2; cy = H / 2;
}
window.addEventListener('resize', resize);
resize();

const N = 28;
const points = [];
for (let i = 0; i < N; i++) {
  for (let j = 0; j < N / 2; j++) {
    const theta = (j / (N / 2)) * Math.PI;
    const phi = (i / N) * Math.PI * 2;
    points.push({
      x: Math.sin(theta) * Math.cos(phi),
      y: Math.cos(theta),
      z: Math.sin(theta) * Math.sin(phi),
      phase: Math.random() * Math.PI * 2
    });
  }
}

const particles = [];
for (let i = 0; i < 160; i++) {
  particles.push({
    angle: Math.random() * Math.PI * 2,
    dist: 0.25 + Math.random() * 2.0,
    speed: 0.002 + Math.random() * 0.007,
    size: 0.6 + Math.random() * 3.2,
    hue: 195 + Math.random() * 50
  });
}

function rotate(p, ry, rx) {
  let x = p.x, y = p.y, z = p.z;
  const cosY = Math.cos(ry), sinY = Math.sin(ry);
  let x1 = x * cosY - z * sinY;
  let z1 = x * sinY + z * cosY;
  const cosX = Math.cos(rx), sinX = Math.sin(rx);
  let y1 = y * cosX - z1 * sinX;
  let z2 = y * sinX + z1 * cosX;
  return { x: x1, y: y1, z: z2 };
}

function draw() {
  t += 0.012;

  // ほぼ真っ黒に近いクリア（コントラスト最大化）
  ctx.fillStyle = 'rgba(0,0,0,0.42)';
  ctx.fillRect(0, 0, W, H);

  const scale = Math.min(W, H) * 0.30;
  const ry = t * 0.42;
  const rx = 0.38 + Math.sin(t * 0.28) * 0.16;

  // 外側きらめき — 暗い背景に対して鋭く光る
  particles.forEach(p => {
    p.angle += p.speed;
    const px = cx + Math.cos(p.angle + t * 0.2) * p.dist * scale * 1.45;
    const py = cy + Math.sin(p.angle + t * 0.2) * p.dist * scale * 0.72;
    const flicker = Math.sin(t * 3.5 + p.angle * 4);
    const a = 0.15 + Math.max(0, flicker) * 0.85; // 強く明滅
    const sz = p.size * (0.6 + Math.max(0, flicker) * 0.9);
    ctx.beginPath();
    ctx.arc(px, py, sz, 0, Math.PI * 2);
    ctx.fillStyle = `hsla(${p.hue}, 85%, 88%, ${a})`;
    ctx.fill();
    // ハイライト核
    if (flicker > 0.4) {
      ctx.beginPath();
      ctx.arc(px, py, sz * 0.35, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,255,255,${flicker * 0.9})`;
      ctx.fill();
    }
  });

  const projected = points.map(p => {
    const r = rotate(p, ry, rx);
    const s = scale / (r.z + 2.8);
    return {
      x: cx + r.x * s,
      y: cy + r.y * s,
      z: r.z,
      s,
      phase: p.phase
    };
  }).sort((a, b) => a.z - b.z);

  projected.forEach(p => {
    if (p.z < -1.3) return;

    // コントラストを極端に：暗い面はほぼ黒、明るい面は真っ白近く
    const raw = Math.max(0, (p.z + 1.3) / 2.4);
    const bright = Math.pow(raw, 1.8); // ガンマで暗い側をさらに落とす
    const pulse = 0.65 + Math.sin(t * 3.2 + p.phase) * 0.35;
    const size = (2.5 + p.s * 0.04) * pulse;

    // 暗い面：ほぼ見えない
    if (bright < 0.18) {
      ctx.beginPath();
      ctx.arc(p.x, p.y, size * 0.7, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(20,25,45,${0.15 + bright * 0.3})`;
      ctx.fill();
      return;
    }

    // 中間〜明るい面
    const r = 30 + bright * 225;
    const g = 40 + bright * 215;
    const b = 80 + bright * 175;
    const alpha = 0.2 + bright * 0.8;

    ctx.beginPath();
    ctx.arc(p.x, p.y, size, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${r|0},${g|0},${b|0},${alpha})`;
    ctx.fill();

    // 超ハイライト（鏡面反射の鋭い光）
    if (bright > 0.55) {
      const hl = (bright - 0.55) / 0.45;
      ctx.beginPath();
      ctx.arc(p.x, p.y, size * (0.25 + hl * 0.35), 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,255,255,${0.5 + hl * 0.5})`;
      ctx.fill();

      // さらに鋭いコア
      if (hl > 0.6) {
        ctx.beginPath();
        ctx.arc(p.x, p.y, size * 0.12, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255,255,255,${hl})`;
        ctx.fill();
      }
    }
  });

  // 中心の強いハイライト（暗い背景との対比）
  const hg = ctx.createRadialGradient(cx, cy, 0, cx, cy, scale * 0.55);
  hg.addColorStop(0, 'rgba(255,255,255,0.28)');
  hg.addColorStop(0.25, 'rgba(200,215,255,0.12)');
  hg.addColorStop(0.55, 'rgba(80,100,180,0.04)');
  hg.addColorStop(1, 'transparent');
  ctx.fillStyle = hg;
  ctx.beginPath();
  ctx.arc(cx, cy, scale * 0.55, 0, Math.PI * 2);
  ctx.fill();

  // ごく薄いスキャンライン（ほぼ黒の中に微かな構造）
  ctx.strokeStyle = 'rgba(60,80,140,0.04)';
  ctx.lineWidth = 1;
  for (let i = 0; i < 6; i++) {
    const y = cy + Math.sin(t * 0.45 + i * 1.1) * scale * 0.85;
    ctx.beginPath();
    ctx.moveTo(cx - scale * 1.3, y);
    ctx.lineTo(cx + scale * 1.3, y);
    ctx.stroke();
  }

  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
