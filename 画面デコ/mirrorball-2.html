<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mirror Ball 02</title>
  <style>
    * { margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, cx, cy, t = 0;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  cx = W / 2; cy = H / 2;
}
window.addEventListener('resize', resize);
resize();

// geometric facets as polygons
const N = 24;
const points = [];
for (let i = 0; i < N; i++) {
  for (let j = 0; j < N / 2; j++) {
    const theta = (j / (N / 2)) * Math.PI;
    const phi = (i / N) * Math.PI * 2;
    points.push({
      x: Math.sin(theta) * Math.cos(phi),
      y: Math.cos(theta),
      z: Math.sin(theta) * Math.sin(phi),
      phase: Math.random() * Math.PI * 2
    });
  }
}

const particles = [];
for (let i = 0; i < 120; i++) {
  particles.push({
    angle: Math.random() * Math.PI * 2,
    dist: 0.3 + Math.random() * 1.8,
    speed: 0.002 + Math.random() * 0.006,
    size: 0.8 + Math.random() * 2.5,
    hue: 200 + Math.random() * 40
  });
}

function rotate(p, ry, rx) {
  let x = p.x, y = p.y, z = p.z;
  const cosY = Math.cos(ry), sinY = Math.sin(ry);
  let x1 = x * cosY - z * sinY;
  let z1 = x * sinY + z * cosY;
  const cosX = Math.cos(rx), sinX = Math.sin(rx);
  let y1 = y * cosX - z1 * sinX;
  let z2 = y * sinX + z1 * cosX;
  return { x: x1, y: y1, z: z2 };
}

function draw() {
  t += 0.012;
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.fillRect(0, 0, W, H);

  const scale = Math.min(W, H) * 0.28;
  const ry = t * 0.4;
  const rx = 0.4 + Math.sin(t * 0.3) * 0.15;

  // outer sparkle ring
  particles.forEach(p => {
    p.angle += p.speed;
    const px = cx + Math.cos(p.angle + t * 0.2) * p.dist * scale * 1.4;
    const py = cy + Math.sin(p.angle + t * 0.2) * p.dist * scale * 0.7;
    const a = 0.3 + Math.sin(t * 2 + p.angle) * 0.3;
    ctx.beginPath();
    ctx.arc(px, py, p.size, 0, Math.PI * 2);
    ctx.fillStyle = `hsla(${p.hue}, 70%, 75%, ${a})`;
    ctx.fill();
  });

  // projected points with size based on z
  const projected = points.map(p => {
    const r = rotate(p, ry, rx);
    const s = scale / (r.z + 2.8);
    return {
      x: cx + r.x * s,
      y: cy + r.y * s,
      z: r.z,
      s,
      phase: p.phase
    };
  }).sort((a, b) => a.z - b.z);

  projected.forEach(p => {
    if (p.z < -1.2) return;
    const bright = Math.max(0, (p.z + 1.2) / 2.2);
    const pulse = 0.7 + Math.sin(t * 3 + p.phase) * 0.3;
    const size = (3 + p.s * 0.035) * pulse;
    const r = 160 + bright * 95;
    const g = 170 + bright * 85;
    const b = 210 + bright * 45;
    ctx.beginPath();
    ctx.arc(p.x, p.y, size, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${r},${g},${b},${0.35 + bright * 0.55})`;
    ctx.fill();
    if (bright > 0.65) {
      ctx.beginPath();
      ctx.arc(p.x, p.y, size * 0.35, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,255,255,${bright * 0.7})`;
      ctx.fill();
    }
  });

  // central highlight
  const hg = ctx.createRadialGradient(cx, cy, 0, cx, cy, scale * 0.6);
  hg.addColorStop(0, 'rgba(220,230,255,0.2)');
  hg.addColorStop(0.5, 'rgba(140,160,220,0.06)');
  hg.addColorStop(1, 'transparent');
  ctx.fillStyle = hg;
  ctx.fillRect(0, 0, W, H);

  // subtle scan lines for depth
  ctx.strokeStyle = 'rgba(100,120,180,0.03)';
  ctx.lineWidth = 1;
  for (let i = 0; i < 8; i++) {
    const y = cy + Math.sin(t * 0.5 + i) * scale * 0.8;
    ctx.beginPath();
    ctx.moveTo(cx - scale * 1.2, y);
    ctx.lineTo(cx + scale * 1.2, y);
    ctx.stroke();
  }

  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
