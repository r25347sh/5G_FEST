<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mirror Ball 01</title>
  <style>
    * { margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, cx, cy;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  cx = W / 2; cy = H / 2;
}
window.addEventListener('resize', resize);
resize();

const facets = [];
const FACET_COUNT = 80;
for (let i = 0; i < FACET_COUNT; i++) {
  const theta = Math.acos(2 * Math.random() - 1);
  const phi = Math.random() * Math.PI * 2;
  facets.push({
    x: Math.sin(theta) * Math.cos(phi),
    y: Math.sin(theta) * Math.sin(phi),
    z: Math.cos(theta),
    brightness: 0.3 + Math.random() * 0.7
  });
}

const beams = [];
for (let i = 0; i < 12; i++) {
  beams.push({
    angle: (i / 12) * Math.PI * 2,
    speed: 0.003 + Math.random() * 0.004,
    width: 0.04 + Math.random() * 0.06,
    alpha: 0.15 + Math.random() * 0.2
  });
}

const sparks = [];
for (let i = 0; i < 60; i++) {
  sparks.push({
    x: Math.random() * W,
    y: Math.random() * H,
    r: 0.5 + Math.random() * 2,
    vx: (Math.random() - 0.5) * 0.4,
    vy: (Math.random() - 0.5) * 0.4,
    life: Math.random()
  });
}

let rotY = 0, rotX = 0.3;

function project(x, y, z, scale) {
  const s = scale / (z + 3.5);
  return { x: cx + x * s, y: cy + y * s, s };
}

function draw() {
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.fillRect(0, 0, W, H);

  // ambient glow
  const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.min(W, H) * 0.45);
  g.addColorStop(0, 'rgba(40,50,80,0.15)');
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // beams
  beams.forEach(b => {
    b.angle += b.speed;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(b.angle);
    const grad = ctx.createLinearGradient(0, 0, 0, -H * 0.7);
    grad.addColorStop(0, `rgba(200,220,255,${b.alpha})`);
    grad.addColorStop(0.5, `rgba(160,180,255,${b.alpha * 0.4})`);
    grad.addColorStop(1, 'rgba(100,120,200,0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(-W * b.width, 0);
    ctx.lineTo(W * b.width, 0);
    ctx.lineTo(W * b.width * 3, -H * 0.7);
    ctx.lineTo(-W * b.width * 3, -H * 0.7);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  });

  // mirror ball facets
  rotY += 0.008;
  rotX = 0.25 + Math.sin(Date.now() * 0.0003) * 0.1;

  const cosY = Math.cos(rotY), sinY = Math.sin(rotY);
  const cosX = Math.cos(rotX), sinX = Math.sin(rotX);
  const scale = Math.min(W, H) * 0.22;

  const sorted = facets.map(f => {
    let x = f.x, y = f.y, z = f.z;
    // rotate Y
    let x1 = x * cosY - z * sinY;
    let z1 = x * sinY + z * cosY;
    // rotate X
    let y1 = y * cosX - z1 * sinX;
    let z2 = y * sinX + z1 * cosX;
    return { x: x1, y: y1, z: z2, b: f.brightness };
  }).sort((a, b) => a.z - b.z);

  sorted.forEach(f => {
    if (f.z < -0.2) return;
    const p = project(f.x, f.y, f.z, scale);
    const size = 4 + p.s * 0.04 * f.b;
    const bright = Math.max(0, f.z + 0.5) * f.b;
    ctx.beginPath();
    ctx.arc(p.x, p.y, size, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${180 + bright * 75},${190 + bright * 65},${220 + bright * 35},${0.4 + bright * 0.6})`;
    ctx.fill();
    if (bright > 0.7) {
      ctx.beginPath();
      ctx.arc(p.x, p.y, size * 0.4, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,255,255,${bright * 0.8})`;
      ctx.fill();
    }
  });

  // center sphere glow
  const sg = ctx.createRadialGradient(cx, cy, 0, cx, cy, scale * 0.9);
  sg.addColorStop(0, 'rgba(200,210,240,0.25)');
  sg.addColorStop(0.6, 'rgba(100,120,180,0.08)');
  sg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = sg;
  ctx.beginPath();
  ctx.arc(cx, cy, scale * 0.9, 0, Math.PI * 2);
  ctx.fill();

  // sparks
  sparks.forEach(s => {
    s.x += s.vx; s.y += s.vy;
    s.life += 0.008;
    if (s.life > 1 || s.x < 0 || s.x > W || s.y < 0 || s.y > H) {
      s.x = cx + (Math.random() - 0.5) * scale * 2;
      s.y = cy + (Math.random() - 0.5) * scale * 2;
      s.life = 0;
    }
    const a = Math.sin(s.life * Math.PI) * 0.7;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(220,230,255,${a})`;
    ctx.fill();
  });

  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
