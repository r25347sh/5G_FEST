<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Opera Pink 02 — Ether Orbs</title>
  <style>
    * { margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #040106; }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, t = 0;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// メインのエーテル球を増やす
const orbs = [];
for (let i = 0; i < 22; i++) {
  orbs.push({
    x: Math.random(),
    y: Math.random(),
    r: 22 + Math.random() * 95,
    vx: (Math.random() - 0.5) * 0.00045,
    vy: (Math.random() - 0.5) * 0.00035,
    phase: Math.random() * Math.PI * 2,
    hue: 315 + Math.random() * 35
  });
}

// 細かい浮遊粒子を大量に追加
const dust = [];
for (let i = 0; i < 180; i++) {
  dust.push({
    x: Math.random(),
    y: Math.random(),
    r: 0.6 + Math.random() * 2.4,
    vx: (Math.random() - 0.5) * 0.0006,
    vy: (Math.random() - 0.5) * 0.0005,
    phase: Math.random() * Math.PI * 2,
    hue: 320 + Math.random() * 40
  });
}

// さらに小さな微粒子
const micro = [];
for (let i = 0; i < 120; i++) {
  micro.push({
    x: Math.random(),
    y: Math.random(),
    r: 0.3 + Math.random() * 1.1,
    speed: 0.0002 + Math.random() * 0.0004,
    angle: Math.random() * Math.PI * 2,
    phase: Math.random() * Math.PI * 2
  });
}

function draw() {
  t += 0.01;
  ctx.fillStyle = 'rgba(4,1,6,0.14)';
  ctx.fillRect(0, 0, W, H);

  // deep ambient
  const bg = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, Math.max(W, H) * 0.75);
  bg.addColorStop(0, 'rgba(45,6,28,0.18)');
  bg.addColorStop(1, 'transparent');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  // 微粒子
  micro.forEach(m => {
    m.angle += m.speed;
    m.x += Math.cos(m.angle) * 0.00025;
    m.y += Math.sin(m.angle * 0.7) * 0.0002;
    if (m.x < -0.05) m.x = 1.05;
    if (m.x > 1.05) m.x = -0.05;
    if (m.y < -0.05) m.y = 1.05;
    if (m.y > 1.05) m.y = -0.05;

    const a = 0.15 + Math.sin(t * 2.5 + m.phase) * 0.12;
    ctx.beginPath();
    ctx.arc(m.x * W, m.y * H, m.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,170,210,${a})`;
    ctx.fill();
  });

  // 中サイズの塵粒子
  dust.forEach(d => {
    d.x += d.vx + Math.sin(t * 0.5 + d.phase) * 0.0001;
    d.y += d.vy + Math.cos(t * 0.4 + d.phase) * 0.00008;
    if (d.x < -0.1) d.x = 1.1;
    if (d.x > 1.1) d.x = -0.1;
    if (d.y < -0.1) d.y = 1.1;
    if (d.y > 1.1) d.y = -0.1;

    const pulse = 0.6 + Math.sin(t * 1.8 + d.phase) * 0.4;
    const a = 0.18 + pulse * 0.35;
    ctx.beginPath();
    ctx.arc(d.x * W, d.y * H, d.r * pulse, 0, Math.PI * 2);
    ctx.fillStyle = `hsla(${d.hue}, 75%, 70%, ${a})`;
    ctx.fill();
  });

  // メインのエーテル球
  orbs.forEach((o, i) => {
    o.x += o.vx + Math.sin(t * 0.4 + o.phase) * 0.00015;
    o.y += o.vy + Math.cos(t * 0.35 + o.phase) * 0.00012;
    if (o.x < -0.2) o.x = 1.2;
    if (o.x > 1.2) o.x = -0.2;
    if (o.y < -0.2) o.y = 1.2;
    if (o.y > 1.2) o.y = -0.2;

    const px = o.x * W;
    const py = o.y * H;
    const pulse = 0.72 + Math.sin(t * 1.2 + o.phase) * 0.28;
    const r = o.r * pulse;

    // outer glow
    const g1 = ctx.createRadialGradient(px, py, 0, px, py, r * 1.9);
    g1.addColorStop(0, `hsla(${o.hue}, 72%, 55%, 0.14)`);
    g1.addColorStop(0.45, `hsla(${o.hue}, 60%, 40%, 0.055)`);
    g1.addColorStop(1, 'transparent');
    ctx.fillStyle = g1;
    ctx.beginPath();
    ctx.arc(px, py, r * 1.9, 0, Math.PI * 2);
    ctx.fill();

    // core
    const g2 = ctx.createRadialGradient(px, py, 0, px, py, r);
    g2.addColorStop(0, `hsla(${o.hue}, 82%, 72%, 0.38)`);
    g2.addColorStop(0.4, `hsla(${o.hue}, 70%, 50%, 0.16)`);
    g2.addColorStop(1, 'transparent');
    ctx.fillStyle = g2;
    ctx.beginPath();
    ctx.arc(px, py, r, 0, Math.PI * 2);
    ctx.fill();

    // bright nucleus
    ctx.beginPath();
    ctx.arc(px, py, r * 0.14, 0, Math.PI * 2);
    ctx.fillStyle = `hsla(${o.hue}, 92%, 88%, ${0.45 + Math.sin(t * 2.2 + i) * 0.25})`;
    ctx.fill();
  });

  // 近い球同士を線でつなぐ（密度が上がったので少し範囲を広げつつ薄く）
  for (let i = 0; i < orbs.length; i++) {
    for (let j = i + 1; j < orbs.length; j++) {
      const dx = (orbs[i].x - orbs[j].x) * W;
      const dy = (orbs[i].y - orbs[j].y) * H;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < 320) {
        const a = (1 - dist / 320) * 0.1;
        ctx.beginPath();
        ctx.moveTo(orbs[i].x * W, orbs[i].y * H);
        ctx.lineTo(orbs[j].x * W, orbs[j].y * H);
        ctx.strokeStyle = `rgba(220,70,130,${a})`;
        ctx.lineWidth = 1;
        ctx.stroke();
      }
    }
  }

  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
