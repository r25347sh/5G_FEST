<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="SHADOWSCRIPT — Black-ops terminal simulation.">
  <meta name="theme-color" content="#07050f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>SHADOWSCRIPT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/hack.css">
  <link rel="stylesheet" href="css/ops.css">
  <link rel="stylesheet" href="css/xfer.css">
  <style>
    .cmd-console {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 28px;
      z-index: 150;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      background: rgba(6, 4, 12, 0.92);
      border-top: 1px solid rgba(255, 45, 149, 0.25);
      font-family: "JetBrains Mono", monospace;
      font-size: 12px;
    }
    .cmd-console .prompt { color: #39ff14; flex-shrink: 0; }
    .cmd-console input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #e8e0f5;
      font-family: inherit;
      font-size: inherit;
      caret-color: #00f5ff;
    }
    .cmd-console input::placeholder { color: rgba(245, 240, 255, 0.28); }
    .cmd-console .hint {
      color: rgba(245, 240, 255, 0.35);
      font-size: 10px;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <canvas id="matrix-canvas" aria-hidden="true"></canvas>
  <div class="ambient" aria-hidden="true"></div>

  <div class="status-bar">
    <div class="left">
      <span class="dot"></span>
      <span class="label-active">OPS · LIVE</span>
      <span>ghost-01</span>
      <span class="label-warn" id="status-mode">STEALTH</span>
    </div>
    <div class="right">
      <span id="hud-clock">00:00:00</span>
      <span id="hud-enc">ENCRYPTED</span>
    </div>
  </div>

  <div class="stage" id="stage"></div>

  <div class="crit-overlay" id="crit-overlay" aria-hidden="true">
    <div class="crit-box">
      <div class="crit-title">[CRITICAL ALERT]</div>
      <div class="crit-body" id="crit-body"></div>
    </div>
  </div>

  <div class="toast" id="toast">
    <div class="toast-title">ALERT</div>
    <div class="toast-body">—</div>
  </div>

  <div class="cmd-console" id="cmd-console">
    <span class="prompt">$</span>
    <input type="text" id="cmd-input" autocomplete="off" spellcheck="false"
           placeholder="command…" aria-label="Command input">
    <span class="hint">help · activate &lt;mod&gt;</span>
  </div>

  <div class="hud-bottom">
    <span>PKTS <span class="val" id="hud-packets">0</span></span>
    <span>XFER <span class="val" id="hud-bytes">0 KB</span></span>
    <span>SESS <span class="val" id="hud-sessions">0</span></span>
    <span>THREAT <span class="val" id="hud-threat">LOW</span></span>
    <span style="margin-left:auto; opacity:0.5;">SHADOWSCRIPT v4.1</span>
  </div>

  <div class="brand">G5 · SCREEN DECO</div>

  <script src="js/lock.js"></script>
  <script src="js/hack.js"></script>
  <script src="js/xfer.js"></script>
  <script src="js/roulette.js"></script>
  <script src="js/cmd.js"></script>
  <script src="js/mods.js"></script>
  <script>
  (function () {
    if (window.LockSystem) {
      LockSystem.init({
        audioSrc: "https://r25347sh.github.io/free_note/lock/alert.mp3",
        unlockSequence: "asobiseminar",
        offSequence: "off",
        enterCountRequired: 3,
        onLock: function () {},
        onAlertStart: function () {
          var thr = document.getElementById("hud-threat");
          if (thr) { thr.textContent = "HIGH"; thr.className = "val val-red"; }
        },
        onAlertStop: function () {
          var thr = document.getElementById("hud-threat");
          if (thr) { thr.textContent = "LOW"; thr.className = "val"; }
        },
        onUnlock: function () {
          var thr = document.getElementById("hud-threat");
          if (thr) { thr.textContent = "LOW"; thr.className = "val"; }
          var mode = document.getElementById("status-mode");
          if (mode) { mode.textContent = "STEALTH"; mode.className = "label-warn"; }
        }
      });
    }
  })();
  </script>
</body>
</html>
