<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Opera Pink 01 — Silk Waves</title>
  <style>
    * { margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #050208; }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, t = 0;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

function draw() {
  t += 0.008;
  ctx.fillStyle = 'rgba(5,2,8,0.12)';
  ctx.fillRect(0, 0, W, H);

  // multiple silk layers
  for (let layer = 0; layer < 6; layer++) {
    const yBase = H * (0.15 + layer * 0.12);
    const amp = 40 + layer * 18;
    const freq = 0.003 + layer * 0.0008;
    const speed = t * (0.6 + layer * 0.15);
    const alpha = 0.08 + (5 - layer) * 0.03;

    ctx.beginPath();
    ctx.moveTo(0, yBase);
    for (let x = 0; x <= W; x += 4) {
      const y = yBase
        + Math.sin(x * freq + speed) * amp
        + Math.sin(x * freq * 1.7 + speed * 1.3) * amp * 0.4
        + Math.cos(x * freq * 0.5 + speed * 0.7) * amp * 0.25;
      ctx.lineTo(x, y);
    }
    ctx.lineTo(W, H);
    ctx.lineTo(0, H);
    ctx.closePath();

    const grad = ctx.createLinearGradient(0, yBase - amp, 0, yBase + amp * 2);
    const pink = layer % 2 === 0 ? '200,40,100' : '180,30,90';
    grad.addColorStop(0, `rgba(${pink},0)`);
    grad.addColorStop(0.4, `rgba(${pink},${alpha})`);
    grad.addColorStop(0.7, `rgba(${pink},${alpha * 0.6})`);
    grad.addColorStop(1, `rgba(${pink},0)`);
    ctx.fillStyle = grad;
    ctx.fill();
  }

  // soft vertical glow columns
  for (let i = 0; i < 5; i++) {
    const x = W * (0.15 + i * 0.18) + Math.sin(t * 0.5 + i) * 30;
    const g = ctx.createLinearGradient(x - 60, 0, x + 60, 0);
    g.addColorStop(0, 'transparent');
    g.addColorStop(0.5, `rgba(190,50,110,${0.04 + Math.sin(t + i) * 0.02})`);
    g.addColorStop(1, 'transparent');
    ctx.fillStyle = g;
    ctx.fillRect(x - 60, 0, 120, H);
  }

  // floating luminous dots
  for (let i = 0; i < 25; i++) {
    const x = (Math.sin(t * 0.3 + i * 1.7) * 0.4 + 0.5) * W;
    const y = (Math.cos(t * 0.25 + i * 2.1) * 0.35 + 0.5) * H;
    const r = 1.5 + Math.sin(t * 2 + i) * 1;
    const a = 0.2 + Math.sin(t * 1.5 + i * 0.8) * 0.15;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,160,200,${a})`;
    ctx.fill();
  }

  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
