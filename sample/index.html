<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D ピタゴラスイッチ | 5G_FEST</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      overflow: hidden;
      background: #0a0a12;
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #e8e8ff;
    }
    #canvas-container {
      position: fixed;
      inset: 0;
    }
    #ui {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 10;
      pointer-events: none;
      padding: 1.2rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      background: linear-gradient(to bottom, rgba(0,0,0,0.75), transparent);
    }
    #ui h1 {
      font-size: 1.15rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-shadow: 0 0 14px #5a9fff;
    }
    #ui .status {
      font-size: 0.85rem;
      opacity: 0.9;
      margin-top: 0.35rem;
    }
    #controls {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      gap: 0.8rem;
      pointer-events: auto;
    }
    button {
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 40px;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 0.04em;
    }
    #startBtn {
      background: linear-gradient(135deg, #3a7fff, #6a4fff);
      color: white;
      box-shadow: 0 6px 22px rgba(74, 120, 255, 0.5);
    }
    #startBtn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(74, 120, 255, 0.65);
    }
    #startBtn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    #resetBtn {
      background: rgba(255,255,255,0.1);
      color: #e0e0ff;
      border: 1px solid rgba(255,255,255,0.22);
    }
    #resetBtn:hover {
      background: rgba(255,255,255,0.18);
    }
    #hint {
      position: fixed;
      bottom: 4.6rem;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.78rem;
      opacity: 0.55;
      text-align: center;
      z-index: 10;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>
  <div id="ui">
    <div>
      <h1>3D ピタゴラスイッチ</h1>
      <div class="status" id="status">準備完了 — スタートを押してください</div>
    </div>
  </div>
  <div id="hint">マウスドラッグで視点回転 / ホイールでズーム</div>
  <div id="controls">
    <button id="startBtn">スタート</button>
    <button id="resetBtn">リセット</button>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/cannon@0.6.2/build/cannon.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <script>
    /*
     ================================================================
      3D ピタゴラスイッチ  —  物理法則に則った本格ギミック連鎖
      Three.js r128 + Cannon.js
      はらはら系・本物風・多段ギミック設計
     ================================================================
    */

    let scene, camera, renderer, controls, world;
    let meshes = [];
    let bodies = [];
    let started = false;
    let clock = new THREE.Clock();
    let firstBall = null;

    const statusEl = document.getElementById('status');
    const startBtn = document.getElementById('startBtn');
    const resetBtn = document.getElementById('resetBtn');

    function init() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x080812);
      scene.fog = new THREE.FogExp2(0x080812, 0.016);

      camera = new THREE.PerspectiveCamera(48, window.innerWidth / window.innerHeight, 0.1, 120);
      camera.position.set(6, 11, 16);

      renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      document.getElementById('canvas-container').appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.07;
      controls.target.set(2, 4.5, 0);
      controls.maxPolarAngle = Math.PI * 0.47;
      controls.minDistance = 4;
      controls.maxDistance = 35;

      scene.add(new THREE.AmbientLight(0x3a3a5a, 0.55));

      const dir = new THREE.DirectionalLight(0xfff4e8, 1.15);
      dir.position.set(10, 18, 8);
      dir.castShadow = true;
      dir.shadow.mapSize.set(2048, 2048);
      dir.shadow.camera.near = 2;
      dir.shadow.camera.far = 45;
      dir.shadow.camera.left = -18;
      dir.shadow.camera.right = 18;
      dir.shadow.camera.top = 18;
      dir.shadow.camera.bottom = -18;
      scene.add(dir);

      const p1 = new THREE.PointLight(0x4a90ff, 0.7, 28);
      p1.position.set(-5, 9, 5);
      scene.add(p1);

      const p2 = new THREE.PointLight(0xff7a5a, 0.45, 22);
      p2.position.set(9, 5, -4);
      scene.add(p2);

      world = new CANNON.World();
      world.gravity.set(0, -9.82, 0);
      world.broadphase = new CANNON.NaiveBroadphase();
      world.solver.iterations = 20;
      world.defaultContactMaterial.friction = 0.45;
      world.defaultContactMaterial.restitution = 0.28;

      createGround();
      buildMachine();

      window.addEventListener('resize', onResize);
      startBtn.addEventListener('click', startMachine);
      resetBtn.addEventListener('click', () => location.reload());

      animate();
    }

    function addBox(sx, sy, sz, px, py, pz, mass, color, rx = 0, ry = 0, rz = 0, metal = 0.25, rough = 0.45) {
      const geo = new THREE.BoxGeometry(sx, sy, sz);
      const mat = new THREE.MeshStandardMaterial({ color, metalness: metal, roughness: rough });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      mesh.position.set(px, py, pz);
      mesh.rotation.set(rx, ry, rz);
      scene.add(mesh);

      const shape = new CANNON.Box(new CANNON.Vec3(sx / 2, sy / 2, sz / 2));
      const body = new CANNON.Body({ mass });
      body.addShape(shape);
      body.position.set(px, py, pz);
      body.quaternion.setFromEuler(rx, ry, rz);
      world.addBody(body);

      meshes.push(mesh);
      bodies.push(body);
      return { mesh, body };
    }

    function addSphere(r, px, py, pz, mass, color) {
      const geo = new THREE.SphereGeometry(r, 28, 28);
      const mat = new THREE.MeshStandardMaterial({ color, metalness: 0.75, roughness: 0.22 });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.castShadow = true;
      mesh.position.set(px, py, pz);
      scene.add(mesh);

      const shape = new CANNON.Sphere(r);
      const body = new CANNON.Body({ mass });
      body.addShape(shape);
      body.position.set(px, py, pz);
      body.linearDamping = 0.04;
      body.angularDamping = 0.06;
      world.addBody(body);

      meshes.push(mesh);
      bodies.push(body);
      return { mesh, body };
    }

    function createGround() {
      const geo = new THREE.PlaneGeometry(50, 50);
      const mat = new THREE.MeshStandardMaterial({ color: 0x14141e, roughness: 0.92, metalness: 0.05 });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.rotation.x = -Math.PI / 2;
      mesh.receiveShadow = true;
      scene.add(mesh);

      const body = new CANNON.Body({ mass: 0 });
      body.addShape(new CANNON.Plane());
      body.quaternion.setFromEuler(-Math.PI / 2, 0, 0);
      world.addBody(body);

      const grid = new THREE.GridHelper(40, 40, 0x252540, 0x181828);
      grid.position.y = 0.015;
      scene.add(grid);
    }

    function buildMachine() {
      // 1. スタート台 + 第1ボール
      addBox(1.4, 0.14, 1.4, -8.0, 10.2, 0, 0, 0x3a4a6a);
      firstBall = addSphere(0.30, -8.0, 10.75, 0, 2.0, 0xb8c0d0);
      firstBall.body.type = CANNON.Body.KINEMATIC;

      // 2. 急傾斜レール（はらはら）
      addBox(6.2, 0.11, 0.95, -4.6, 8.3, 0, 0, 0x5a6a8a, 0, 0, -0.42);
      addBox(6.2, 0.28, 0.07, -4.6, 8.48, 0.52, 0, 0x4a5a7a, 0, 0, -0.42);
      addBox(6.2, 0.28, 0.07, -4.6, 8.48, -0.52, 0, 0x4a5a7a, 0, 0, -0.42);

      // 3. シーソー（ヒンジ）
      const pivot = addBox(0.35, 0.9, 0.35, -1.2, 5.9, 0, 0, 0x2a3550);
      const seesaw = addBox(3.6, 0.13, 0.8, -1.2, 6.45, 0, 3.5, 0x8b6b4a, 0, 0, 0, 0.15, 0.65);

      const hinge = new CANNON.HingeConstraint(seesaw.body, pivot.body, {
        pivotA: new CANNON.Vec3(0, -0.1, 0),
        axisA: new CANNON.Vec3(0, 0, 1),
        pivotB: new CANNON.Vec3(0, 0.45, 0),
        axisB: new CANNON.Vec3(0, 0, 1)
      });
      world.addConstraint(hinge);

      // 4. 第2ボール待機台
      addBox(1.0, 0.12, 1.0, 1.1, 6.7, 0, 0, 0x3a4a6a);
      addBox(0.15, 0.25, 0.5, 0.55, 6.85, 0, 0.15, 0x6a5a4a);
      addSphere(0.27, 1.1, 7.15, 0, 1.4, 0xd0a050);

      // 5. 中間 + スパイラル風
      addBox(2.2, 0.1, 0.9, 2.8, 5.9, 0, 0, 0x5a6a8a, 0, 0, -0.12);

      for (let i = 0; i < 10; i++) {
        const t = i / 10;
        const ang = t * Math.PI * 1.35;
        const radius = 1.9;
        const x = 4.6 + Math.cos(ang) * radius;
        const z = Math.sin(ang) * radius;
        const y = 5.5 - t * 3.2;
        addBox(1.15, 0.09, 0.48, x, y, z, 0, 0x6a7a9a, 0, -ang + Math.PI / 2, -0.18);
      }

      // 6. ドミノ列
      for (let i = 0; i < 11; i++) {
        const d = addBox(0.11, 0.75, 0.38, 6.8 + i * 0.30, 2.55, 0, 0.35, 0xe8d4a8, 0, 0, 0, 0.08, 0.7);
        d.body.quaternion.setFromEuler(0, 0, (i % 2 === 0 ? 0.015 : -0.012));
      }

      // 7. 振り子
      const pPivot = addBox(0.3, 0.3, 0.3, 10.6, 5.6, 0, 0, 0x2a3550);
      const rod = addBox(0.09, 2.4, 0.09, 10.6, 4.35, 0, 1.2, 0x555566);
      const bob = addSphere(0.38, 10.6, 3.05, 0, 4.5, 0x8a4535);

      const pendHinge = new CANNON.HingeConstraint(rod.body, pPivot.body, {
        pivotA: new CANNON.Vec3(0, 1.15, 0),
        axisA: new CANNON.Vec3(0, 0, 1),
        pivotB: new CANNON.Vec3(0, 0, 0),
        axisB: new CANNON.Vec3(0, 0, 1)
      });
      world.addConstraint(pendHinge);

      const lock = new CANNON.LockConstraint(rod.body, bob.body);
      world.addConstraint(lock);

      rod.body.quaternion.setFromEuler(0, 0, 0.35);
      bob.body.position.set(10.6 + Math.sin(0.35) * 1.3, 3.05 + (1 - Math.cos(0.35)) * 1.3, 0);

      // 8. 最終レール + ゴール
      addBox(4.5, 0.11, 0.85, 13.2, 1.95, 0, 0, 0x5a6a8a, 0, 0, -0.22);
      addBox(1.6, 0.14, 1.6, 16.0, 1.35, 0, 0, 0x2a5a45);
      addSphere(0.28, 16.0, 1.85, 0, 1.1, 0x50d0a0);

      // 9. 支柱
      addBox(0.22, 10.3, 0.22, -8.7, 5.15, 0.9, 0, 0x222233);
      addBox(0.22, 10.3, 0.22, -8.7, 5.15, -0.9, 0, 0x222233);
      addBox(0.28, 6.5, 0.28, -1.2, 3.25, 1.3, 0, 0x222233);
      addBox(0.28, 6.5, 0.28, -1.2, 3.25, -1.3, 0, 0x222233);
      addBox(0.25, 5.8, 0.25, 10.6, 2.9, 1.1, 0, 0x222233);

      const wallGeo = new THREE.BoxGeometry(45, 16, 0.4);
      const wallMat = new THREE.MeshStandardMaterial({ color: 0x10101a, roughness: 0.95 });
      const wall = new THREE.Mesh(wallGeo, wallMat);
      wall.position.set(3, 7.5, -9);
      wall.receiveShadow = true;
      scene.add(wall);
    }

    function startMachine() {
      if (started) return;
      started = true;
      startBtn.disabled = true;
      statusEl.textContent = '連鎖開始… 第1ボールが動き出します';

      firstBall.body.type = CANNON.Body.DYNAMIC;
      firstBall.body.velocity.set(2.4, -0.8, 0);
      firstBall.body.wakeUp();

      const msgs = [
        { t: 1600, text: '急傾斜レール… 落ちそうで落ちない…' },
        { t: 3200, text: 'シーソーに到達！ 傾きますか？' },
        { t: 4800, text: '第2ボール解放！ スパイラルへ突入' },
        { t: 7500, text: 'ドミノ列に接触… 連鎖は続くか？' },
        { t: 10500, text: '振り子が動き出す… 最終段階' },
        { t: 14000, text: 'ゴールへ向かう最後のボール…' }
      ];
      msgs.forEach(m => {
        setTimeout(() => {
          if (started) statusEl.textContent = m.text;
        }, m.t);
      });
    }

    function onResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.04);
      world.step(1 / 60, dt, 4);

      for (let i = 0; i < meshes.length; i++) {
        meshes[i].position.copy(bodies[i].position);
        meshes[i].quaternion.copy(bodies[i].quaternion);
      }

      controls.update();
      renderer.render(scene, camera);
    }

    init();
  </script>
</body>
</html>
